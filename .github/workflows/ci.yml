name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Analyze example
        run: cd example && flutter pub get && flutter analyze

  build-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter pub get
      - name: Validate the publishable package
        run: dart pub publish --dry-run

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: cd example && flutter build apk --debug

  # Swift Package Manager, Flutter's default. It names a path package after its
  # directory, so the checkout is named as the plugin is (the repo is zktls-flutter).
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: zktls_flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: cd zktls_flutter/example && flutter build ios --simulator --debug

  # CocoaPods, for apps that turn Swift Package Manager off.
  build-ios-cocoapods:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter config --no-enable-swift-package-manager
      - run: cd example && flutter build ios --simulator --debug
