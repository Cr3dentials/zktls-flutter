name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - name: Analyze example
        run: cd example && flutter pub get && flutter analyze

  # The example app links ZktlsSDK, which is consumed from a local build until the
  # SDK is published (see README's "native SDK" note). CI cannot resolve it yet, so
  # these two run for signal but do not fail the overall check.
  # TODO: remove continue-on-error once the bridges flip to the published SDK coordinate.
  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: cd example && flutter build apk --debug

  build-ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: cd example && flutter build ios --simulator --debug
